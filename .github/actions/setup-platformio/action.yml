name: Set up PlatformIO
description: Install the pinned pioarduino core and cache PlatformIO packages
inputs:
  cache-scope:
    description: Firmware environment or analysis job name
    required: true
  environment:
    description: Build environment whose packages should be installed with retries
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Cache PlatformIO packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        # The penv is tied to the runner's Python, so recreate it on each job.
        path: |
          ~/.platformio/packages
          ~/.platformio/platforms
        key: ${{ runner.os }}-platformio-py3.14-core6.1.19-penv-v2-${{ inputs.cache-scope }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-py3.14-core6.1.19-penv-v2-${{ inputs.cache-scope }}-
          ${{ runner.os }}-platformio-py3.14-core6.1.19-penv-v2-

    - name: Install PlatformIO Core
      shell: bash
      run: |
        # The ESP platform uses this penv for its second pass. Use the same
        # pinned core for the first pass so SCons cannot change mid-build.
        uv venv --python "$pythonLocation/bin/python" "$HOME/.platformio/penv"
        uv pip install --python "$HOME/.platformio/penv/bin/python" "pioarduino==6.1.19"
        echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
        "$HOME/.platformio/penv/bin/pio" --version

    - name: Install build packages with retries
      if: inputs.environment != ''
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.environment }}
      run: |
        # Retry dependency downloads only; compilation and tests run separately.
        for delay in 30 60 120; do
          if pio pkg install -e "$BUILD_ENV"; then
            exit 0
          fi
          echo "Package install failed; retrying in ${delay}s"
          sleep "$delay"
        done
        # Preserve failure after the initial attempt and three retries.
        pio pkg install -e "$BUILD_ENV"
